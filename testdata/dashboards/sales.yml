schema: https://getbruin.com/schemas/dac/dashboard/v1
name: Sales Analytics
description: Real-time sales performance and revenue tracking
connection: local_duckdb

filters:
  - name: region
    type: select
    multiple: false
    default: "All"
    options:
      values: ["All", "North America", "Europe", "APAC"]
  - name: date_range
    type: date-range
    default: last_90_days

queries:
  total_revenue:
    sql: |
      SELECT SUM(amount) as value FROM sales
      WHERE created_at >= '{{ filters.date_range.start }}'
        AND created_at <= '{{ filters.date_range.end }}'
      {% if filters.region != 'All' %}
        AND region = '{{ filters.region }}'
      {% endif %}
  revenue_by_month:
    sql: |
      SELECT
          DATE_TRUNC('month', created_at) AS month,
          SUM(amount) AS revenue
      FROM sales
      WHERE created_at >= '{{ filters.date_range.start }}'
        AND created_at <= '{{ filters.date_range.end }}'
      {% if filters.region != 'All' %}
        AND region = '{{ filters.region }}'
      {% endif %}
      GROUP BY 1
      ORDER BY 1

rows:
  # KPI row
  - widgets:
      - name: Total Revenue
        type: metric
        query: total_revenue
        value:
          field: value
          type: number
          format: "$,.0f"
        col: 3
      - name: Total Orders
        type: metric
        col: 3
        sql: |
          SELECT COUNT(*) as total FROM orders
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
        value:
          field: total
          type: number
          format: ",.0f"
      - name: Average Order Value
        type: metric
        col: 3
        sql: |
          SELECT ROUND(AVG(amount), 2) as avg_value FROM orders
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
        value:
          field: avg_value
          type: number
          format: "$,.2f"
      - name: P90 Order Value
        type: metric
        col: 3
        sql: |
          SELECT ROUND(quantile_cont(amount, 0.9), 2) as p90_value FROM orders
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
        value:
          field: p90_value
          type: number
          format: "$,.2f"

  # Revenue trend + region breakdown
  - widgets:
      - name: Revenue Trend
        type: chart
        chart: area
        query: revenue_by_month
        x: { field: month, type: date, title: Month, format: "%b %Y" }
        y: { field: [revenue], type: number, title: Revenue, format: "$,.0f" }
        col: 8
      - name: Revenue by Region
        type: chart
        chart: pie
        col: 4
        sql: |
          SELECT region, SUM(amount) as total FROM sales
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
          {% if filters.region != 'All' %}
            AND region = '{{ filters.region }}'
          {% endif %}
          GROUP BY 1
        label: region
        value: { field: total }

  # Orders by month + status breakdown
  - widgets:
      - name: Sales by Region
        type: chart
        chart: bar
        stacked: true
        color: { field: region }
        col: 6
        sql: |
          SELECT
            STRFTIME(DATE_TRUNC('month', created_at), '%Y-%m') AS month,
            region,
            SUM(amount) AS revenue
          FROM sales
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
          {% if filters.region != 'All' %}
            AND region = '{{ filters.region }}'
          {% endif %}
          GROUP BY 1, 2
          ORDER BY 1, 2
        x: { field: month, type: date, title: Month, format: "%b %y" }
        y: { field: revenue, type: number, title: Revenue, format: "$,.0f" }
      - name: Order Status
        type: chart
        chart: pie
        col: 6
        sql: |
          SELECT status, COUNT(*) as count FROM orders
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
          GROUP BY 1
          ORDER BY 2 DESC
        label: status
        value: { field: count }

  # Top customers + region revenue table
  - widgets:
      - name: Top Customers
        type: table
        col: 6
        sql: |
          SELECT
            customer_name,
            COUNT(*) as orders,
            SUM(amount) as total_spent,
            ROUND(AVG(amount), 2) as avg_order
          FROM orders
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
          GROUP BY 1
          ORDER BY 3 DESC
          LIMIT 10
      - name: Revenue by Region & Month
        type: table
        col: 6
        sql: |
          SELECT
            region,
            STRFTIME(DATE_TRUNC('month', created_at), '%Y-%m') AS month,
            COUNT(*) as sales_count,
            SUM(amount) as revenue
          FROM sales
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
          {% if filters.region != 'All' %}
            AND region = '{{ filters.region }}'
          {% endif %}
          GROUP BY 1, 2
          ORDER BY 1, 2

  # Recent orders
  - widgets:
      - name: Recent Orders
        type: table
        sql: |
          SELECT id, customer_name, amount, status, created_at
          FROM orders
          WHERE created_at >= '{{ filters.date_range.start }}'
            AND created_at <= '{{ filters.date_range.end }}'
          ORDER BY created_at DESC
          LIMIT 25
        col: 12
