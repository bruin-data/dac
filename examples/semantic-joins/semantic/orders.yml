schema: v1
name: orders
label: Orders
description: Order facts joined to the customers model via customer_id

source:
  table: |
    (
      SELECT 1 AS order_id, 101 AS customer_id, DATE '2025-01-15' AS order_date, 'completed' AS status, 'electronics' AS category, 100 AS amount
      UNION ALL SELECT 2, 102, DATE '2025-01-20', 'completed', 'accessories', 50
      UNION ALL SELECT 3, 101, DATE '2025-02-05', 'pending', 'electronics', 70
      UNION ALL SELECT 4, 201, DATE '2025-02-10', 'completed', 'electronics', 200
      UNION ALL SELECT 5, 101, DATE '2025-03-01', 'completed', 'furniture', 300
      UNION ALL SELECT 6, 201, DATE '2025-03-15', 'cancelled', 'furniture', 10
      UNION ALL SELECT 7, 102, DATE '2025-03-20', 'completed', 'electronics', 80
    ) AS orders

primary_key: order_id

joins:
  - name: customers
    relationship: many_to_one
    foreign_key: customer_id

dimensions:
  - name: order_date
    type: time
    granularities:
      month: date_trunc('month', order_date)
  - name: status
    type: string
  - name: category
    type: string

metrics:
  - name: revenue
    label: Revenue
    expression: sum(amount)
    format:
      type: currency
      currency: USD
      decimals: 0
  - name: order_count
    label: Orders
    expression: count(distinct order_id)
  - name: avg_order_value
    label: Avg Order Value
    expression: "{revenue} / {order_count}"
    format:
      type: currency
      currency: USD
      decimals: 2

segments:
  - name: completed
    filter: "status = 'completed'"
