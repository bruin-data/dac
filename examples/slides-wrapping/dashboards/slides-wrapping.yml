name: Slides wrapping demo
description: Static sample data for testing wrapped Google Slides exports. Expected output is one title slide and six content slides.

rows:
  # Slides 2 and 3: these two wide metrics must never share one slide.
  - widgets:
      - id: revenue
        name: Revenue
        type: metric
        col: 8
        data: { columns: [revenue], rows: [[12400]] }
        value: { field: revenue, type: number, format: "$,.0f" }
      - id: orders
        name: Orders
        type: metric
        col: 8
        data: { columns: [orders], rows: [[318]] }
        value: { field: orders, type: number, format: ",.0f" }

  # Slide 4: chart. Slide 5: table (8 columns) and metric (4 columns).
  - widgets:
      - id: bookings_trend
        name: Bookings trend
        type: chart
        chart: line
        col: 8
        data:
          columns: [month, bookings]
          rows: [[May, 42], [Jun, 68], [Jul, 55], [Aug, 89], [Sep, 103], [Oct, 118]]
        x: { field: month, type: category }
        y: { field: bookings, type: number }
      - id: route_summary
        name: Route summary
        type: table
        col: 8
        data:
          columns: [route, bookings, revenue]
          rows: [[Airport express, 128, 7200], [City centre, 286, 11640], [Coastal route, 94, 4380]]
      - id: occupancy
        name: Hotel occupancy
        type: metric
        col: 4
        data: { columns: [occupancy], rows: [[0.78]] }
        value: { field: occupancy, type: number, format: ".0%" }

  # Slide 6 uses the FIRST tab: $24,800. Slide 7 shows repeat bookings: 84.
  - widgets:
      - id: travel_metrics
        name: Travel metrics
        type: tabs
        col: 8
        tabs:
          - name: Revenue
            type: metric
            data: { columns: [revenue], rows: [[24800]] }
            value: { field: revenue, type: number, format: "$,.0f" }
          - name: Orders
            type: metric
            data: { columns: [orders], rows: [[999]] }
            value: { field: orders, type: number, format: ",.0f" }
      - id: repeat_bookings
        name: Repeat bookings
        type: metric
        col: 8
        data: { columns: [bookings], rows: [[84]] }
        value: { field: bookings, type: number, format: ",.0f" }
