name: Semantic Null Filters
description: >
  Reproduces bruin-data/bruin#3017. The data has US, DE, FR, and one order
  with no country. Each widget title says which rows it should return.
connection: local_duckdb
model: orders

rows:
  - widgets:
      - name: not_in US (want DE, FR, null)
        type: table
        dimensions: [{name: country}]
        metrics: [order_count]
        filters:
          - {dimension: country, operator: not_in, value: [US]}
        col: 4
      - name: not_equals US (want DE, FR, null)
        type: table
        dimensions: [{name: country}]
        metrics: [order_count]
        filters:
          - {dimension: country, operator: not_equals, value: US}
        col: 4
      - name: in US or null (want US, null)
        type: table
        dimensions: [{name: country}]
        metrics: [order_count]
        filters:
          - {dimension: country, operator: in, value: [US, null]}
        col: 4
  - widgets:
      - name: not_in US and null (want DE, FR)
        type: table
        dimensions: [{name: country}]
        metrics: [order_count]
        filters:
          - {dimension: country, operator: not_in, value: [US, null]}
        col: 4
      - name: in US (want US)
        type: table
        dimensions: [{name: country}]
        metrics: [order_count]
        filters:
          - {dimension: country, operator: in, value: [US]}
        col: 4
