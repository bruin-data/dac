name: Semantic Null Filters Expression
description: >
  Null filters on a dimension defined by an expression (NOT active). The data
  has active = true, false, and NULL, so inactive is false, true, and NULL.
connection: local_duckdb
model: flags

rows:
  - widgets:
      - name: in null (want null)
        type: table
        dimensions: [{name: inactive}]
        metrics: [n]
        filters:
          - {dimension: inactive, operator: in, value: [null]}
        col: 6
      - name: not_equals true (want false, null)
        type: table
        dimensions: [{name: inactive}]
        metrics: [n]
        filters:
          - {dimension: inactive, operator: not_equals, value: true}
        col: 6
