name: Widget Tabs
description: "Widget tabs (`type: tabs`): each tab is a complete widget with its own type. Inline data, so it renders without a connection."

rows:
  # Dashboard tabs (row-level `tab:`) group whole rows; widget tabs live inside a widget.
  - tab: Overview
    widgets:
      # Titled container; tabs are different chart types plus a table.
      - name: Sales
        type: tabs
        col: 7
        tabs:
          - name: Revenue
            type: chart
            chart: bar
            data: { columns: [month, revenue], rows: [[Jan, 400], [Feb, 520], [Mar, 610]] }
            x: { field: month, type: category }
            y: { field: revenue, type: number }
          - name: Trend
            type: chart
            chart: line
            data: { columns: [month, revenue], rows: [[Jan, 400], [Feb, 520], [Mar, 610]] }
            x: { field: month, type: category }
            y: { field: revenue, type: number }
          - name: Details
            type: table
            data: { columns: [month, revenue, orders], rows: [[Jan, 400, 120], [Feb, 520, 145], [Mar, 610, 160]] }

      # Title-less container: the tab bar labels the widget.
      - type: tabs
        col: 5
        tabs:
          - name: Total
            type: metric
            data: { columns: [total], rows: [[1530]] }
            value: { field: total, type: number, format: "$,.0f" }
          - name: By region
            type: chart
            chart: pie
            data: { columns: [region, revenue], rows: [[EU, 700], [US, 830], [APAC, 560]] }
            label: region
            value: { field: revenue, type: number }
          - name: Growth
            type: chart
            chart: area
            data: { columns: [month, users], rows: [[Jan, 200], [Feb, 260], [Mar, 340]] }
            x: { field: month, type: category }
            y: { field: users, type: number }

  # Many tabs: the tab bar scrolls horizontally when they don't fit.
  - tab: Activity
    widgets:
      - name: Daily active users
        type: tabs
        col: 12
        tabs:
          - name: Jan
            type: chart
            chart: line
            data: { columns: [day, users], rows: [[1, 33], [2, 42], [3, 39]] }
            x: { field: day, type: number }
            y: { field: users, type: number }
          - name: Feb
