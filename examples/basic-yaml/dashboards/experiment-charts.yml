schema: https://getbruin.com/schemas/dac/dashboard/v1
name: Experiment Readout
description: CI bands, forest plots, error-bar caps and reference lines/bands — mirrors the cloud demo gallery (inline data, no connection needed)

rows:
  - height: 340px
    widgets:
      - id: ex_line_band
        name: Line + CI band
        type: chart
        chart: line
        col: 6
        x:
          field: day
          type: number
          title: day K
        y:
          field: effect
          type: number
          title: "return Δ %"
        yMin: lo
        yMax: hi
        refLines:
          - axis: y
            value: 0
            label: no effect
        data:
          columns: [day, effect, lo, hi]
          rows:
            - [0, 2.0, -4.0, 8.0]
            - [1, 4.0, -2.7, 10.7]
            - [2, 6.0, -1.4, 13.4]
            - [3, 8.0, -0.1, 16.1]
            - [4, 10.0, 1.2, 18.8]
            - [5, 12.0, 2.5, 21.5]
            - [6, 14.0, 3.8, 24.2]
      - id: ex_forest
        name: Forest (horizontal)
        type: chart
        chart: forest
        col: 6
        x:
          field: metric
          type: category
          title: metric
        y:
          field: effect
          type: number
          title: "treatment − control, %"
        yMin: lo
        yMax: hi
        data:
          columns: [metric, effect, lo, hi]
          rows:
            - ["in-app min", 8, -4, 20]
            - ["board min", 9, -2, 20]
            - ["sessions", 6, 1, 12]
            - ["wins", 15, 6, 24]
            - ["attempts", 11, 2, 21]
            - ["revenue", -38, -70, 3]

  - height: 340px
    widgets:
      - id: ex_perline
        name: Per-line CI bands (2 lines)
        type: chart
        chart: line
        col: 12
        x:
          field: day
          type: number
          title: day K
        y:
          field: [rv, inter]
          type: number
          title: "ads Δ, % of control"
        yMin:
          rv: rv_lo
          inter: in_lo
        yMax:
          rv: rv_hi
          inter: in_hi
        refLines:
          - axis: y
            value: 0
            label: no effect
        data:
          columns: [day, rv, inter, rv_lo, rv_hi, in_lo, in_hi]
          rows:
            - [0, 18, 25, 5, 30, 12, 40]
            - [1, 20, 34, 6, 34, 18, 50]
            - [2, 25, 41, 8, 42, 22, 60]
            - [3, 40, 27, 15, 65, 10, 44]
            - [4, 61, 33, 25, 97, 12, 54]
            - [5, 86, 22, 40, 130, 0, 44]
            - [6, 88, 0, 42, 134, -20, 20]

  - height: 360px
    widgets:
      - id: ex_forest_vertical
        name: Forest — vertical (dot + whisker)
        type: chart
        chart: forest
        col: 6
        horizontal: false
        x:
          field: cell
          type: category
          title: cell
        y:
          field: effect
          type: number
          title: "returned d1, %"
        yMin: lo
        yMax: hi
        data:
          columns: [cell, effect, lo, hi]
          rows:
            - ["A ref", 32.5, 28, 38]
            - ["B", 28, 24, 33]
            - ["C", 37, 32, 42]
            - ["D", 34, 29, 39]
      - id: ex_forest_dual
        name: Forest — grouped (overlap vs whole)
        type: chart
        chart: forest
        col: 6
        x:
          field: metric
          type: category
          title: metric
        y:
          field: [overlap, whole]
          type: number
          title: "treatment − control, %"
        yMin:
          overlap: o_lo
          whole: w_lo
        yMax:
          overlap: o_hi
          whole: w_hi
        data:
          columns: [metric, overlap, whole, o_lo, o_hi, w_lo, w_hi]
          rows:
            - ["in-app min", 34, 35, 15, 54, 14, 56]
            - ["sessions", 19, 19, 7, 31, 6, 34]
            - ["wins", 20, 19, 9, 32, 7, 32]
            - ["revenue $", 32, 29, -17, 81, -16, 73]

  - height: 360px
    widgets:
      - id: ex_forest_band
        name: "Forest + reference band (±MDE, grey = below resolution)"
        type: chart
        chart: forest
        col: 12
        x:
          field: metric
          type: category
          title: metric
        y:
          field: effect
          type: number
          title: "(D−C) − (B−A) in MDE units"
        yMin: lo
        yMax: hi
        refBands:
          - axis: x
            from: -1
            to: 1
            label: below resolution
        refLines:
          - axis: x
            value: -1
          - axis: x
            value: 1
        data:
          columns: [metric, effect, lo, hi]
          rows:
            - ["in-app min", 0.2, -0.6, 1.0]
            - ["board min", 0.15, -0.6, 0.9]
            - ["sessions", -0.1, -0.8, 0.6]
            - ["wins", -0.15, -0.85, 0.55]
            - ["attempts", 0.1, -0.6, 0.8]
            - ["revenue $", -0.6, -1.35, 0.15]
            - ["return d1", 0.15, -0.55, 0.85]

  - height: 340px
    widgets:
      - id: ex_bar
        name: Grouped bar (2 series)
        type: chart
        chart: bar
        col: 6
        horizontal: true
        x:
          field: arm
          type: category
          title: arm
        y:
          field: [control, treatment]
          type: number
          title: installs
        yMin:
          control: c_lo
          treatment: t_lo
        yMax:
          control: c_hi
          treatment: t_hi
        data:
          columns: [arm, control, treatment, c_lo, c_hi, t_lo, t_hi]
          rows:
            - ["New_Flow", 920, 910, 880, 960, 872, 948]
            - ["Scale-Up", 1010, 1005, 968, 1052, 963, 1047]
            - ["inters/no-ads", 990, 1050, 949, 1031, 1006, 1094]
      - id: ex_bar_err
        name: Bar + error-bar caps
        type: chart
        chart: bar
        col: 6
        x:
          field: metric
          type: category
          title: metric
        y:
          field: treatment
          type: number
          title: "% of control"
        yMin: t_lo
        yMax: t_hi
        refLines:
          - axis: y
            value: 100
            label: control baseline
        data:
          columns: [metric, treatment, t_lo, t_hi]
          rows:
            - ["in-app min", 118, 100, 136]
            - ["sessions", 109, 100, 118]
            - ["wins", 128, 115, 141]
            - ["revenue $", 88, 55, 120]

  - height: 340px
    widgets:
      - id: ex_heatmap
        name: Heatmap
        type: chart
        chart: heatmap
        col: 6
        showValues: true
        x:
          field: nf_arm
          type: category
          title: New_Flow arm
        y:
          field: su_arm
          type: category
          title: Scale-Up arm
        value:
          field: count
        data:
          columns: [nf_arm, su_arm, count]
          rows:
            - ["Control", "control", 482]
            - ["Control", "treatment", 449]
            - ["New_Flow", "control", 455]
            - ["New_Flow", "treatment", 460]
      - id: ex_scatter
        name: Scatter
        type: chart
        chart: scatter
        col: 6
        x:
          field: nf_effect
          type: number
          title: New_Flow effect
        y:
          field: su_effect
          type: number
          title: Scale-Up effect
        data:
          columns: [metric, nf_effect, su_effect]
          rows:
            - ["in-app", 12, 9]
            - ["sessions", 3, 5]
            - ["wins", 15, 11]
            - ["revenue", -8, 2]
            - ["return d1", 4, 6]

  - height: 360px
    widgets:
      - id: ex_bar_grouped_err
        name: "B1 · 2×2 cell means, indexed to A=100 (95% CI)"
        type: chart
        chart: bar
        col: 12
        x:
          field: metric
          type: category
          title: metric
        y:
          field: [A, B, C, D]
          type: number
          title: "% of reference cell"
        yMin:
          A: a_lo
          B: b_lo
          C: c_lo
          D: d_lo
        yMax:
          A: a_hi
          B: b_hi
          C: c_hi
          D: d_hi
        refLines:
          - axis: y
            value: 100
            label: A = 100
        data:
          columns: [metric, A, B, C, D, a_lo, a_hi, b_lo, b_hi, c_lo, c_hi, d_lo, d_hi]
          rows:
            - ["in-app min", 100, 101, 131, 141, 84, 117, 87, 117, 110, 152, 116, 166]
            - ["board min", 100, 105, 134, 145, 83, 117, 90, 120, 112, 157, 118, 173]
            - ["sessions", 100, 102, 121, 121, 90, 110, 91, 113, 107, 135, 107, 135]
            - ["wins", 100, 120, 125, 140, 90, 110, 107, 133, 112, 138, 125, 155]
            - ["attempts", 100, 111, 123, 137, 88, 112, 99, 123, 109, 137, 120, 155]
            - ["revenue $", 100, 94, 176, 83, 74, 128, 60, 128, 93, 207, 55, 110]
