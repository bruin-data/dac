schema: https://getbruin.com/schemas/dac/dashboard/v1
name: Column Groups
description: Illustrative financial data with collapsible details

rows:
  - widgets:
      - name: Regional Financials
        type: table
        col: 12
        data:
          columns: [region, revenue, cost, profit, orders, average_order, shipping_cost, status]
          rows:
            - [Europe, 240000, 150000, 90000, 1200, 200, 12000, Active]
            - [Americas, 360000, 200000, 160000, 1500, 240, 18000, Active]
            - [Asia Pacific, 180000, 110000, 70000, 1000, 180, 9000, Review]
        columns:
          - { name: region, label: Region, frozen: true }
          - { name: profit, label: Profit, number: currency, group: financials, collapsed: true }
          - { name: revenue, label: Revenue, number: currency, group: financials }
          - { name: cost, label: Cost, number: currency, group: orders }
          - { name: shipping_cost, label: Shipping cost, number: currency, group: orders }
          - { name: orders, label: Orders, number: number, group: financials }
          - { name: average_order, label: Average order, number: currency, group: financials }
          - { name: status, label: Status }

  - widgets:
      - name: Monthly Performance
        type: table
        col: 12
        data:
          columns: [region, q1, jan, feb, mar, q2, apr, may, jun, target, owner]
          rows:
            - [Europe, 610000, 190000, 205000, 215000, 655000, 210000, 220000, 225000, 1300000, Ana]
            - [Americas, 880000, 280000, 295000, 305000, 940000, 300000, 315000, 325000, 1800000, Ben]
            - [Asia Pacific, 450000, 140000, 150000, 160000, 495000, 160000, 165000, 170000, 950000, Chen]
        columns:
          - { name: region, label: Region, frozen: true }
          - { name: q1, label: Q1, number: currency, group: q1, collapsed: true }
          - { name: jan, label: January, number: currency, group: q1 }
          - { name: feb, label: February, number: currency, group: q1 }
          - { name: mar, label: March, number: currency, group: q1 }
          - { name: q2, label: Q2, number: currency, group: q2 }
          - { name: apr, label: April, number: currency, group: q2 }
          - { name: may, label: May, number: currency, group: q2 }
          - { name: jun, label: June, number: currency, group: q2 }
          - { name: target, label: Target, number: currency }
          - { name: owner, label: Owner }

  - widgets:
      - name: Order Breakdown
        type: table
        col: 12
        data:
          columns: [orders, average_order, returns]
          rows:
            - [1200, 200, 40]
            - [1500, 240, 55]
            - [1000, 180, 30]
        columns:
          - { name: orders, label: Orders, number: number, group: orders, collapsed: true }
          - { name: average_order, label: Average order, number: currency, group: orders }
          - { name: returns, label: Returns, number: number, group: orders }
